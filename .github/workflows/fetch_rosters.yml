name: fetch rosters

# Manual run only: Actions tab -> "fetch rosters" -> "Run workflow".
# Fetches the 2025 baseball rosters (bats/throws, hometown, high school, previous school) for the
# teams in tools/roster_teams.csv with tools/fetch_rosters.py: robots.txt obeyed, at least 3 s
# between requests to a site, one request at a time. Sites behind bot protection are logged and
# skipped, never worked around.
#
# Owner decision 2026-10-07: rosters are used only for aggregate distributions. The raw fetch
# (rosters_2025.csv with player names, raw/ pages, state.json, the log) lives in $RUNNER_TEMP for
# this job only: it is never committed, never uploaded as an artifact and never cached.
# tools/aggregate_rosters.py turns it into count and share tables (it fails if a roster name
# reaches any output), and only data/ncaa_2025/roster_aggregates/ (with failures.csv: team and
# reason, no player data) is committed, to a new branch rosters/aggregates-<date>-<run id> made
# from origin/main. No pull request is opened: the working session merges the branch.

on:
  workflow_dispatch:
    inputs:
      delay:
        description: "Seconds between requests to one site (minimum 3)"
        default: "3"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DELAY: ${{ inputs.delay }}
      AGG: data/ncaa_2025/roster_aggregates
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Working directory for the raw fetch (outside the repository)
        run: echo "WORK=$RUNNER_TEMP/rosters" >> "$GITHUB_ENV"

      - name: Self-tests (fetcher parsers; aggregation and name-leak check on synthetic rosters)
        run: |
          python tools/fetch_rosters.py --selftest
          python tools/aggregate_rosters.py --selftest

      - name: Probe 5 roster pages (Sidearm, WMT, Presto)
        run: |
          python tools/fetch_rosters.py --probe 5 --delay "$DELAY" --out "$WORK"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, os, pathlib
          p = pathlib.Path(os.environ["WORK"]) / "probe.json"
          res = json.loads(p.read_text()) if p.exists() else []
          c = collections.Counter((r["platform"], r["status"].split(":")[0]) for r in res)
          print("## Probe\n\n| Platform | Status | Teams |\n|---|---|---|")
          for (plat, st), n in sorted(c.items()):
              print(f"| {plat} | {st} | {n} |")
          EOF

      - name: Fetch all rosters
        # Stops itself well before the job limit so the partial result is still aggregated and
        # committed (coverage.csv then counts the teams not attempted). The fetcher saves its
        # progress (state.json) after every team and resumes from it within this job's working
        # directory; nothing raw survives the job, so a later run fetches everything again.
        continue-on-error: true
        run: |
          timeout --signal=INT 150m python tools/fetch_rosters.py --delay "$DELAY" --out "$WORK"

      - name: Aggregate (counts and shares only; fails if a roster name reaches an output)
        id: aggregate
        if: always()
        run: |
          if [ ! -f "$WORK/state.json" ]; then echo "nothing fetched"; exit 1; fi
          python tools/aggregate_rosters.py --in "$WORK" --out "$AGG"

      - name: Summarize coverage (counts only, no names)
        if: always() && steps.aggregate.outcome == 'success'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import pandas as pd
          c = pd.read_csv(os.path.join(os.environ["AGG"], "coverage.csv"), keep_default_na=False)
          t = c.pivot_table(index="metric", columns="scope_value", values="value", aggfunc="first", sort=False).fillna("")
          print("\n## Coverage\n")
          print("| metric | " + " | ".join(t.columns) + " |")
          print("|---|" + "---|" * len(t.columns))
          for m, row in t.iterrows():
              print(f"| {m} | " + " | ".join(str(v) for v in row) + " |")
          EOF

      - name: Commit the aggregates to a new branch from main (no pull request)
        if: always() && steps.aggregate.outcome == 'success'
        run: |
          set -euo pipefail
          branch="rosters/aggregates-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -r "$AGG" "$stage/roster_aggregates"
          cp tools/aggregate_rosters.py "$stage/"
          cp .github/workflows/fetch_rosters.yml "$stage/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard -q
          git clean -fdq
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B "$branch" origin/main
          mkdir -p data/ncaa_2025 tools .github/workflows
          rm -rf "$AGG"
          cp -r "$stage/roster_aggregates" "$AGG"
          cp "$stage/aggregate_rosters.py" tools/aggregate_rosters.py
          git add -- "$AGG" tools/aggregate_rosters.py
          git commit -q -m "Roster aggregates 2025: fetch of $(date -u +%Y-%m-%d) by the fetch rosters workflow (run ${{ github.run_id }}); counts and shares only, no player rows or names (owner decision 2026-10-07)"
          # The workflow file goes in its own commit: the job token may not be allowed to change
          # workflows, and then the branch is pushed without it.
          cp "$stage/fetch_rosters.yml" .github/workflows/fetch_rosters.yml
          wf=0
          if ! git diff --quiet -- .github/workflows/fetch_rosters.yml || ! git ls-files --error-unmatch .github/workflows/fetch_rosters.yml >/dev/null 2>&1; then
            git add -- .github/workflows/fetch_rosters.yml
            git commit -q -m "fetch rosters workflow as run (run ${{ github.run_id }})"
            wf=1
          fi
          if ! git push -u origin "$branch"; then
            if [ "$wf" = 1 ]; then
              git reset -q --hard HEAD~1
              git push -u origin "$branch"
              echo "The workflow file was left out of the branch: the job token may not change workflows." >> "$GITHUB_STEP_SUMMARY"
            else
              exit 1
            fi
          fi
          git log -2 --stat --format="%H %s"
          echo "Pushed branch \`$branch\` (aggregates only): ${{ github.server_url }}/${{ github.repository }}/tree/$branch" >> "$GITHUB_STEP_SUMMARY"
