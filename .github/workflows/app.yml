name: app

# The game UI's tests (the connector against the engine, the API against the engine, save and load, the action
# menu's legality): run when a push or pull request touches the app. A change that also touches the engine or
# config runs the full "tests" workflow as well.
on:
  push:
    paths:
      - "app/**"
      - "tests/test_app_*.py"
      - "render.yaml"
      - "scripts/bench_app.py"
      - "reports/app_latency.md"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/test_app_*.py"
      - "render.yaml"
      - "scripts/bench_app.py"
      - "reports/app_latency.md"
      - ".github/workflows/app.yml"

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/test_app_connector.py tests/test_app_api.py tests/test_app_menu.py tests/test_app_calendar.py tests/test_app_schools.py
